<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Daddies Padel Community Platform">
  <meta name="theme-color" content="#1C1F1D">

  <!-- Preconnect to Firebase services — eliminates DNS+TLS latency (~200-500ms) -->
  <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://apis.google.com">

  <!-- Plus Jakarta Sans — sole typeface per DESIGN.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daddies Padel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daddies Padel</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pre-Flutter loading screen — shows while CanvasKit + Dart loads -->
  <style>
    body {
      margin: 0;
      background-color: #1C1F1D;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.3s ease-out;
    }
    #loading-indicator .logo-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #DADDD6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    #loading-indicator .logo-circle svg {
      width: 48px;
      height: 48px;
      fill: #1C1F1D;
    }
    #loading-indicator .app-name {
      margin-top: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #DADDD6;
      letter-spacing: 8px;
    }
    #loading-indicator .app-subtitle {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #7C9A6E;
      letter-spacing: 3px;
    }
    #loading-indicator .progress-bar {
      margin-top: 48px;
      width: 120px;
      height: 2px;
      background-color: rgba(124,154,110,0.2);
      border-radius: 1px;
      overflow: hidden;
    }
    #loading-indicator .progress-fill {
      width: 40%;
      height: 100%;
      background-color: #7C9A6E;
      border-radius: 1px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(150%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <!-- Loading screen visible while Flutter engine initializes -->
  <div id="loading-indicator" aria-label="Loading Daddies Padel">
    <div class="logo-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M19.52 2.49c-2.34-2.34-6.62-1.87-9.55 1.06-1.6 1.6-2.52 3.87-2.54 5.46-.02 1.58.26 3.89-1.35 5.5l-4.24 4.24 1.42 1.42 4.24-4.24c1.61-1.61 3.45-1.33 5.5-1.35 1.58-.02 3.86-.94 5.46-2.54 2.93-2.93 3.4-7.21 1.06-9.55zm-9.2 9.19c-1.53-1.53-1.05-4.61 1.06-6.72s5.18-2.59 6.72-1.06c1.53 1.53 1.05 4.61-1.06 6.72s-5.19 2.59-6.72 1.06z"/>
      </svg>
    </div>
    <div class="app-name">DADDIES</div>
    <div class="app-subtitle">PADEL COMMUNITY</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <script>
    // Unregister any old service workers (from previous deployments)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
    }

    // Remove loading indicator once Flutter renders first frame
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- Core Web Vitals measurement — loads after Flutter, low priority -->
  <script src="js/web-vitals-init.js" defer></script>
</body>
</html>
