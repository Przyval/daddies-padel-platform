{% extends "base.html" %}
{% block title %}Edit Sesi — Daddies Padel{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.session_detail', match_id=match.id) }}" class="hover:opacity-80 transition-opacity text-primary-container">
    <span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline font-bold tracking-tight text-xl text-primary-container">Edit Sesi</h1>
{% endblock %}

{% block content %}
<section class="card">
    <form action="{{ url_for('main.session_edit', match_id=match.id) }}" method="POST" class="space-y-4">
        <div>
            <label class="label-overline mb-2 block">Judul Sesi</label>
            <input class="input-field" name="title" type="text" value="{{ match.title }}" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label-overline mb-2 block">Tanggal</label>
                <input class="input-field" name="date" type="date" value="{{ match.date_time.strftime('%Y-%m-%d') }}" required>
            </div>
            <div>
                <label class="label-overline mb-2 block">Waktu</label>
                <input class="input-field" name="time" type="time" value="{{ match.date_time.strftime('%H:%M') }}" required>
            </div>
        </div>
        <div>
            <label class="label-overline mb-2 block">Lokasi</label>
            <input class="input-field" name="location" type="text" value="{{ match.location }}" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label-overline mb-2 block">Harga (IDR)</label>
                <input class="input-field" name="price" type="number" value="{{ match.price }}" required>
            </div>
            <div>
                <label class="label-overline mb-2 block">Maks Pemain</label>
                <input class="input-field" name="max_players" type="number" value="{{ match.max_players }}" required>
            </div>
        </div>
        <div>
            <label class="label-overline mb-2 block">Catatan</label>
            <textarea class="input-field" name="notes" rows="3" placeholder="Opsional...">{{ match.notes or '' }}</textarea>
        </div>
        <div class="pt-2">
            <button type="submit" class="btn-primary w-full py-4 text-base">Simpan Perubahan</button>
        </div>
    </form>
</section>
{% endblock %}
