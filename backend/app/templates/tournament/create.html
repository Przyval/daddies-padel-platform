{% extends "base.html" %}
{% block title %}Buat Turnamen — Daddies Padel{% endblock %}

{% block header_left %}
<a href="{{ url_for('tournament.tournament_list') }}" class="text-primary-container">
    <span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline font-bold tracking-tight text-xl text-primary-container">Buat Turnamen</h1>
{% endblock %}

{% block content %}
<form method="post" class="space-y-8">

    <!-- Format selection -->
    <section class="card space-y-4">
        <h2 class="text-lg font-bold tracking-tight">Format Turnamen</h2>
        <div class="grid grid-cols-2 gap-3">
            <label class="card !p-4 cursor-pointer has-[:checked]:ring-2 has-[:checked]:ring-primary has-[:checked]:bg-primary-fixed/20 transition-all">
                <input type="radio" name="format" value="americano" checked class="sr-only">
                <div class="text-center space-y-2">
                    <span class="material-symbols-outlined text-2xl text-primary">groups</span>
                    <p class="text-sm font-bold text-on-surface">Americano</p>
                    <p class="text-[10px] text-on-surface-variant leading-tight">Round-robin tetap. Tiap pemain partner dgn semua pemain lain.</p>
                </div>
            </label>
            <label class="card !p-4 cursor-pointer has-[:checked]:ring-2 has-[:checked]:ring-primary has-[:checked]:bg-primary-fixed/20 transition-all">
                <input type="radio" name="format" value="mexicano" class="sr-only">
                <div class="text-center space-y-2">
                    <span class="material-symbols-outlined text-2xl text-primary">shuffle</span>
                    <p class="text-sm font-bold text-on-surface">Mexicano</p>
                    <p class="text-[10px] text-on-surface-variant leading-tight">Dinamis. Partner berubah tiap ronde berdasarkan standing.</p>
                </div>
            </label>
        </div>
    </section>

    <!-- Tournament info -->
    <section class="card space-y-5">
        <h2 class="text-lg font-bold tracking-tight">Detail Turnamen</h2>

        <div>
            <label class="label-overline mb-2 block">Nama Turnamen</label>
            <input class="input-field" name="name" type="text" placeholder="mis. Tuesday Night Grind" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="label-overline mb-2 block">Tanggal</label>
                <input class="input-field" name="date" type="date" required>
            </div>
            <div>
                <label class="label-overline mb-2 block">Waktu</label>
                <input class="input-field" name="time" type="time" value="19:00" required>
            </div>
        </div>

        <div>
            <label class="label-overline mb-2 block">Lokasi</label>
            <select class="input-field" name="venue">
                <option>Daddies Court</option>
                <option>GBK Padel Arena</option>
                <option>The Padel Club</option>
            </select>
        </div>

        <div>
            <label class="label-overline mb-2 block">Jumlah Court</label>
            <div class="flex gap-2">
                {% for c in [1,2,3,4] %}
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="num_courts" value="{{ c }}" {{ 'checked' if c == 2 }} class="sr-only peer">
                    <div class="text-center py-3 rounded-full bg-surface-container-high text-on-surface font-bold text-sm
                                peer-checked:bg-primary peer-checked:text-on-primary transition-all">
                        {{ c }}
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>
    </section>

    <!-- Points config -->
    <section class="card space-y-4">
        <h2 class="text-lg font-bold tracking-tight">Sistem Poin</h2>
        <div class="grid grid-cols-3 gap-3">
            <div>
                <label class="label-overline mb-2 block text-center">Menang</label>
                <input class="input-field text-center text-lg font-bold" name="win_points" type="number" value="3" min="0" max="10">
            </div>
            <div>
                <label class="label-overline mb-2 block text-center">Seri</label>
                <input class="input-field text-center text-lg font-bold" name="draw_points" type="number" value="1" min="0" max="10">
            </div>
            <div>
                <label class="label-overline mb-2 block text-center">Kalah</label>
                <input class="input-field text-center text-lg font-bold" name="loss_points" type="number" value="0" min="0" max="10">
            </div>
        </div>
    </section>

    <!-- Submit -->
    <button type="submit" class="btn-primary w-full py-4 text-base gap-2">
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
        Lanjut — Tambah Peserta
    </button>
</form>
{% endblock %}
