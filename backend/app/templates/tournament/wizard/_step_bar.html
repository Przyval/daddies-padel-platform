{# Step indicator bar — reused across all wizard steps #}
{% set steps = ['Nama', 'Format', 'Config', 'Pemain', 'Review'] %}
<div class="flex items-center justify-between px-2 mb-6">
    {% for label in steps %}
    <div class="flex flex-col items-center gap-1">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all
                    {% if loop.index0 < current_step %}bg-success text-on-primary
                    {% elif loop.index0 == current_step %}bg-primary text-on-primary
                    {% else %}bg-surface-container-high text-on-surface-variant{% endif %}">
            {% if loop.index0 < current_step %}
            <span class="material-symbols-outlined text-sm">check</span>
            {% else %}
            {{ loop.index }}
            {% endif %}
        </div>
        <span class="text-[8px] font-bold uppercase tracking-widest
                     {% if loop.index0 == current_step %}text-primary{% else %}text-on-surface-variant{% endif %}">
            {{ label }}
        </span>
    </div>
    {% if not loop.last %}
    <div class="flex-1 h-px mx-1 mt-[-16px]
                {% if loop.index0 < current_step %}bg-success{% else %}bg-surface-container-high{% endif %}"></div>
    {% endif %}
    {% endfor %}
</div>
