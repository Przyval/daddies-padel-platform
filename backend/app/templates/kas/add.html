{% extends "base.html" %}
{% block title %}Tambah Transaksi — Daddies Padel{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.kas_dashboard') }}" class="text-primary-container">
    <span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline font-bold tracking-tight text-xl text-primary-container">Transaksi Baru</h1>
{% endblock %}

{% block content %}
<form method="post" class="space-y-6">
    <!-- Type -->
    <section class="card space-y-4">
        <h2 class="text-sm font-bold">Tipe</h2>
        <div class="flex gap-2">
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="income" checked class="sr-only peer">
                <div class="text-center py-3 rounded-full bg-surface-container-high font-bold text-sm
                            peer-checked:bg-success peer-checked:text-white transition-all">
                    <span class="material-symbols-outlined text-sm align-text-bottom">arrow_downward</span> Masuk
                </div>
            </label>
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="expense" class="sr-only peer">
                <div class="text-center py-3 rounded-full bg-surface-container-high font-bold text-sm
                            peer-checked:bg-error peer-checked:text-white transition-all">
                    <span class="material-symbols-outlined text-sm align-text-bottom">arrow_upward</span> Keluar
                </div>
            </label>
        </div>
    </section>

    <!-- Category -->
    <section class="card space-y-4">
        <h2 class="text-sm font-bold">Kategori</h2>
        <div class="grid grid-cols-3 gap-2">
            {% for key, cat in categories.items() %}
            <label class="cursor-pointer">
                <input type="radio" name="category" value="{{ key }}" {{ 'checked' if loop.first }} class="sr-only peer">
                <div class="text-center py-3 px-2 rounded-2xl bg-surface-container-low text-on-surface-variant
                            peer-checked:bg-primary peer-checked:text-on-primary transition-all">
                    <span class="material-symbols-outlined text-lg block mb-1">{{ cat.icon }}</span>
                    <span class="text-[10px] font-bold">{{ cat.label }}</span>
                </div>
            </label>
            {% endfor %}
        </div>
    </section>

    <!-- Amount + Description -->
    <section class="card space-y-4">
        <div>
            <label class="label-overline mb-2 block">Jumlah (IDR)</label>
            <input class="input-field text-xl font-bold" name="amount" type="number" min="0" placeholder="100000" required>
        </div>
        <div>
            <label class="label-overline mb-2 block">Keterangan</label>
            <input class="input-field" name="description" type="text" placeholder="mis. Sewa lapangan Selasa 25 Mar">
        </div>
    </section>

    <button type="submit" class="btn-primary w-full py-4 text-base gap-2">
        <span class="material-symbols-outlined text-lg">save</span>
        Simpan (Menunggu Approval)
    </button>
</form>
{% endblock %}
