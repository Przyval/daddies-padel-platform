{% extends "base.html" %}
{% block title %}Edit Profil — Daddies Padel{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.profile') }}" class="hover:opacity-80 transition-opacity text-primary-container">
    <span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline font-bold tracking-tight text-xl text-primary-container">Edit Profil</h1>
{% endblock %}

{% block content %}
<!-- Avatar -->
<section class="text-center">
    <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mx-auto shadow-lg">
        <span class="text-2xl font-extrabold text-surface">{{ user.initials }}</span>
    </div>
</section>

<!-- Form -->
<section class="card">
    <form action="{{ url_for('main.edit_profile') }}" method="POST" class="space-y-4">
        <div>
            <label class="label-overline mb-2 block">Nama Lengkap</label>
            <input class="input-field" name="username" type="text" value="{{ user.username }}" required>
        </div>
        <div>
            <label class="label-overline mb-2 block">Nickname</label>
            <input class="input-field" name="nickname" type="text" value="{{ user.nickname or '' }}" placeholder="Panggilan (opsional)">
        </div>
        <div>
            <label class="label-overline mb-2 block">No. HP / WhatsApp</label>
            <input class="input-field" name="phone" type="tel" value="{{ user.phone }}" required>
        </div>
        <div>
            <label class="label-overline mb-2 block">Bio</label>
            <textarea class="input-field" name="bio" rows="3" placeholder="Ceritakan tentang kamu...">{{ user.bio or '' }}</textarea>
        </div>
        <div class="pt-2">
            <button type="submit" class="btn-primary w-full py-4 text-base">Simpan</button>
        </div>
    </form>
</section>
{% endblock %}
