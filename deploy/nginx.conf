# nginx reverse proxy for the Daddies Padel API.
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/daddies
#   sudo ln -s /etc/nginx/sites-available/daddies /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.daddiespadel.com   # adds TLS automatically
#
# Replace api.daddiespadel.com with your real domain everywhere below.

server {
    listen 80;
    server_name api.daddiespadel.com;

    # certbot will rewrite this block to redirect 80 -> 443 and inject the
    # SSL certificate lines. Keep this HTTP block for the initial challenge.

    # Allow larger uploads (payment proof / avatar images).
    client_max_body_size 10M;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve uploaded files directly (faster than proxying through Flask).
    location /static/ {
        alias /opt/daddies/app/backend/app/static/;
        expires 7d;
        access_log off;
    }
}
